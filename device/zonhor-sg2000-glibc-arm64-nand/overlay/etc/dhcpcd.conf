# Zonhor SG2000 dhcpcd configuration.
# See dhcpcd.conf(5) for details.
#
# Use MAC-based Client ID (not DUID+IAID):
# - eth0/wlan0 share the same UID suffix → IAID collision under duid mode
# - same MAC → same Client ID after AIC module reload / new ifindex
# - better compatibility with consumer APs (Xiaomi etc.)
clientid

# Persist lease files across dhcpcd restarts / interface flaps.
persistent

# Avoid advertising a dhcpcd vendor class that some APs mishandle.
vendorclassid

option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name
option rapid_commit
require dhcp_server_identifier

# Hardware-based SLAAC (stable with fixed MAC from zonhor-mac-from-uid).
slaac hwaddr

# usb0 = RNDIS gadget (static 192.168.42.1); eth0 often floats without DHCP
# and previously collided with wlan0 IAID / stole link-local default route.
denyinterfaces usb0 eth0

# wlan0 is the primary uplink after AIC8800 associate.
interface wlan0
	ipv4only
	# Prefer last lease; do not fall back to IPv4LL on WiFi.
	noipv4ll
